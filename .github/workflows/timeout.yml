name: timeout
on: push

jobs:
  timeout:
    runs-on: ubuntu-latest
    timeout-minute: 1
    steps:
    - name: loop-for-1-minute
      run: |
        count = 0
        while true; do
          echo 'seconds: $count'
          count = $((count+1))
          sleep 1 
        done
    - name: echo
      run: echo hello
